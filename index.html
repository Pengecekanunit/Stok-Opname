<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Stok Opname Offline Mandiri</title>

  <!-- Tailwind CSS & Flowbite CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />

  <!-- ExcelJS Library untuk Export Excel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>

  <style>
    @media print {
      body * {
        visibility: hidden;
      }
      #area-cetak-ksu, #area-cetak-ksu * {
        visibility: visible;
      }
      #area-cetak-ksu {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
      .no-print {
        display: none !important;
      }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased">

  <!-- Main Container -->
  <div class="max-w-7xl mx-auto px-4 py-6">
    <header class="mb-6 flex flex-col md:flex-row md:items-center md:justify-between gap-4 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">Sistem Stok Opname Offline Mandiri</h1>
        <p class="text-sm text-slate-500">Kelola dan rekap data kelengkapan unit serta barang minus KSU</p>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="bukaModalCetakKSU()" type="button" class="inline-flex items-center gap-2 px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-sm rounded-lg shadow-sm transition-all">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
          Laporan & Export
        </button>
      </div>
    </header>

    <!-- Content Section -->
    <main class="space-y-6">
      <div id="sec-barang-minus" class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="p-6 border-b border-slate-200">
          <h2 class="text-lg font-semibold text-slate-800">Daftar Barang Minus KSU</h2>
          <p class="text-sm text-slate-500">Lengkapi harga satuan dan kode sparepart untuk barang yang minus.</p>
        </div>
        <div class="p-6 minus-price-card overflow-x-auto">
          <table class="w-full text-sm text-left text-slate-600">
            <thead class="text-xs uppercase bg-slate-50 text-slate-700 border-b border-slate-200">
              <tr>
                <th class="px-4 py-3">Kategori - Jenis</th>
                <th class="px-4 py-3 text-center">Qty Minus</th>
                <th class="px-4 py-3">Harga Satuan (Rp)</th>
                <th class="px-4 py-3">Kode Sparepart</th>
              </tr>
            </thead>
            <tbody id="tbody-barang-minus">
              <!-- Contoh Baris Data -->
              <tr class="border-b border-slate-100">
                <td class="px-4 py-3 font-medium text-slate-900">HELM - HELM HONDA TRX-3</td>
                <td class="px-4 py-3 text-center font-bold text-red-600">-2</td>
                <td class="px-4 py-3">
                  <input type="number" data-price-key="helm-trx3" class="w-full p-2 border border-slate-300 rounded-md text-sm" placeholder="Masukkan harga...">
                </td>
                <td class="px-4 py-3">
                  <input type="text" data-part-key="helm-trx3" class="w-full p-2 border border-slate-300 rounded-md text-sm" placeholder="Masukkan kode...">
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal Cetak/Export KSU -->
  <div id="modal-cetak-ksu" tabindex="-1" class="fixed top-0 left-0 right-0 z-50 hidden w-full p-4 overflow-x-hidden overflow-y-auto md:inset-0 h-[calc(100%-1rem)] max-h-full flex items-center justify-center bg-slate-900/50 backdrop-blur-sm">
    <div class="relative w-full max-w-md max-h-full">
      <div class="relative bg-white rounded-xl shadow-lg border border-slate-200">
        <div class="flex items-center justify-between p-4 md:p-5 border-b border-slate-200">
          <h3 class="text-lg font-semibold text-slate-900">Export Laporan KSU</h3>
          <button type="button" onclick="tutupModalCetakKSU()" class="text-slate-400 bg-transparent hover:bg-slate-100 hover:text-slate-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center">
            <svg class="w-3 h-3" fill="none" viewBox="0 0 14 14"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/></svg>
          </button>
        </div>

        <div class="p-4 md:p-5 space-y-4">
          <div id="modal-cetak-error" class="hidden p-3 text-sm text-red-800 rounded-lg bg-red-50 border border-red-200" role="alert"></div>

          <div>
            <label for="modal-cabang-nama" class="block mb-2 text-sm font-medium text-slate-900">Nama Cabang / Pos Dealer</label>
            <input type="text" id="modal-cabang-nama" class="bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-lg focus:ring-emerald-500 focus:border-emerald-500 block w-full p-2.5" placeholder="Contoh: Honda Cabang Utama">
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label for="modal-tgl-mulai" class="block mb-2 text-sm font-medium text-slate-900">Tanggal Mulai</label>
              <input type="date" id="modal-tgl-mulai" class="bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-lg focus:ring-emerald-500 focus:border-emerald-500 block w-full p-2.5">
            </div>
            <div>
              <label for="modal-tgl-selesai" class="block mb-2 text-sm font-medium text-slate-900">Tanggal Selesai</label>
              <input type="date" id="modal-tgl-selesai" class="bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-lg focus:ring-emerald-500 focus:border-emerald-500 block w-full p-2.5">
            </div>
          </div>
        </div>

        <div class="flex items-center p-4 md:p-5 border-t border-slate-200 gap-3">
          <button type="button" onclick="exportBarangMinusExcelKSU()" class="w-full text-white bg-emerald-600 hover:bg-emerald-700 font-medium rounded-lg text-sm px-5 py-2.5 text-center transition-all flex items-center justify-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            Download Excel
          </button>
          <button type="button" onclick="tutupModalCetakKSU()" class="w-full text-slate-500 bg-white hover:bg-slate-100 border border-slate-200 font-medium rounded-lg text-sm px-5 py-2.5 text-center">Batal</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Area Cetak Tersembunyi (KSU) -->
  <div id="area-cetak-ksu" class="hidden"></div>

  <!-- Flowbite JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>

  <!-- Application Logic -->
  <script>
    function bukaModalCetakKSU() {
      document.getElementById('modal-cetak-error').classList.add('hidden');
      document.getElementById('modal-cetak-ksu').classList.remove('hidden');
    }

    function tutupModalCetakKSU() {
      document.getElementById('modal-cetak-ksu').classList.add('hidden');
    }

    function formatTanggalLaporan(tglString) {
      if (!tglString) return '-';
      const [tahun, bulan, tanggal] = tglString.split('-');
      return `${tanggal}/${bulan}/${tahun}`;
    }

    function simpanHeaderAudit() {
      // Placeholder simpan data header audit jika ada kebutuhan localStorage
    }

    function perbaruiRingkasanCetakKSU() {
      // Placeholder pembaruan UI ringkasan
    }

    async function muatRekapKelengkapan() {
      // Placeholder penyiapan data rekap
      return Promise.resolve();
    }

    async function exportBarangMinusExcelKSU() {
      const cabang = document.getElementById('modal-cabang-nama').value.trim();
      const tglMulai = document.getElementById('modal-tgl-mulai').value;
      const tglSelesai = document.getElementById('modal-tgl-selesai').value;
      const error = document.getElementById('modal-cetak-error');

      if (!cabang) {
        error.textContent = 'Pilih nama cabang terlebih dahulu.';
        error.classList.remove('hidden');
        document.getElementById('modal-cabang-nama').focus();
        return;
      }
      if (!tglMulai || !tglSelesai) {
        error.textContent = 'Isi tanggal mulai dan tanggal selesai audit.';
        error.classList.remove('hidden');
        return;
      }
      if (tglMulai > tglSelesai) {
        error.textContent = 'Tanggal mulai audit tidak boleh setelah tanggal selesai.';
        error.classList.remove('hidden');
        return;
      }

      simpanHeaderAudit();
      perbaruiRingkasanCetakKSU();
      await muatRekapKelengkapan();

      if (typeof ExcelJS === 'undefined') {
        error.textContent = 'Library format Excel belum siap. Periksa koneksi internet lalu coba lagi.';
        error.classList.remove('hidden');
        return;
      }

      const workbook = new ExcelJS.Workbook();
      workbook.creator = 'Sistem Stok Opname Offline Mandiri';
      workbook.created = new Date();

      const worksheet = workbook.addWorksheet('Barang Minus KSU', {
        pageSetup: {
          paperSize: 9,
          orientation: 'portrait',
          fitToPage: true,
          fitToWidth: 1,
          fitToHeight: 0,
          margins: { left: 0.2, right: 0.2, top: 0.35, bottom: 0.35, header: 0.15, footer: 0.15 }
        }
      });

      worksheet.columns = [
        { width: 6 }, { width: 18 }, { width: 32 }, { width: 14 },
        { width: 18 }, { width: 22 }, { width: 20 }
      ];

      const thinBorder = {
        top: { style: 'thin', color: { argb: 'FFCBD5E1' } },
        left: { style: 'thin', color: { argb: 'FFCBD5E1' } },
        bottom: { style: 'thin', color: { argb: 'FFCBD5E1' } },
        right: { style: 'thin', color: { argb: 'FFCBD5E1' } }
      };

      // Header Judul
      const titleRow = worksheet.addRow(['DAFTAR BARANG MINUS KSU']);
      worksheet.mergeCells(`A${titleRow.number}:G${titleRow.number}`);
      titleRow.height = 28;
      titleRow.getCell(1).font = { name: 'Arial', size: 14, bold: true, color: { argb: 'FF0F172A' } };
      titleRow.getCell(1).alignment = { horizontal: 'center', vertical: 'middle' };

      const branchRow = worksheet.addRow(['Nama Cabang / Pos Dealer', cabang]);
      worksheet.mergeCells(`B${branchRow.number}:G${branchRow.number}`);
      branchRow.height = 22;
      branchRow.getCell(1).font = { name: 'Arial', size: 10, bold: true };
      branchRow.getCell(2).font = { name: 'Arial', size: 11, bold: true };
      branchRow.getCell(2).alignment = { horizontal: 'center', vertical: 'middle' };

      const dateRow = worksheet.addRow([
        'Tanggal Mulai', formatTanggalLaporan(tglMulai), '',
        'Tanggal Selesai', formatTanggalLaporan(tglSelesai)
      ]);
      worksheet.mergeCells(`B${dateRow.number}:C${dateRow.number}`);
